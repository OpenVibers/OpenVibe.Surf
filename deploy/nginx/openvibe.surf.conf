## ═══════════════════════════════════════════════════════════════
## openvibe.surf — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.surf.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5110, systemd unit openvibe-surf) renders every page and serves the
## Watch/Ride/Web API; nginx terminates TLS, redirects www → apex, rate-limits the API, sign-in and the task forms,
## and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public 30 s for the Watch feed, 60 s for Ride and the
## pages; private, no-store for a page or answer rendered for a signed-in person). Watch-together SSE is the one
## unbuffered location. Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=surf_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=surf_api:10m rate=5r/s;
# Starting an Actor task is a form, not a read: a person types, so a small budget is plenty. Both the JSON route and
# the no-JavaScript form take it, so neither is a way around the other.
limit_req_zone $binary_remote_addr zone=surf_forms:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.surf www.openvibe.surf;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.surf$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.surf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.surf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.surf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.surf$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.surf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.surf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.surf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.surf.access.log;
    error_log  /var/log/nginx/openvibe.surf.error.log;

    # A query is at most 500 characters; 32 KB leaves room for headers.
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── The task form and the JSON route it shares: GET /web/go, POST /api/v1/web/tasks ──
    # A person's query is a write, so these have their own small budget. Nothing else under /api/v1/web is exposed.
    location = /web/go {
        limit_except GET { deny all; }
        limit_req zone=surf_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5110;
    }

    location ^~ /api/v1/web/ {
        limit_except GET POST { deny all; }
        limit_req zone=surf_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5110;
    }

    # ── Watch together: SSE (GET /watch/p/<id>/events) ──────
    # Server-Sent Events must reach the browser as they are written: no proxy buffering, no gzip, and a read
    # timeout longer than the browser's idle window (the app sends a keepalive comment every 15 s). A restart of
    # the app ends every party; nginx only carries the stream.
    location ~ ^/watch/p/[A-Za-z0-9_-]+/events$ {
        limit_except GET { deny all; }
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:5110;
    }

    # ── The Watch and Ride API: reads only ──────────────────
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=surf_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5110;
    }

    # ── Sign-in: GET only ───────────────────────────────────
    # /auth/login, /auth/callback, /auth/me and /auth/logout are all GETs here. The app's POST /auth/logout confirm
    # is defence in depth and is not exposed by nginx; a same-origin navigation signs out directly.
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=surf_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5110;
    }

    location /auth/ {
        limit_except GET { deny all; }
        limit_req zone=surf_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5110;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5110/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, discovery, static assets, release.json ──────
    location / {
        proxy_pass http://127.0.0.1:5110;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
